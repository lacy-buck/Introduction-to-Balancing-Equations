<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemBalance Studio</title>
    <script>
      // Redirect GitHub Pages subpath 404s back to the root application
      var path = window.location.pathname;
      var segments = path.split('/').filter(Boolean);
      if (window.location.hostname.endsWith('github.io') && segments.length > 0) {
        window.location.replace('/' + segments[0] + '/');
      } else {
        window.location.replace('./');
      }
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #f8fafc; color: #1e293b;">
    <div style="text-align: center; padding: 2rem;">
      <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">ChemBalance Studio</h1>
      <p style="color: #64748b; margin-bottom: 1.5rem;">Redirecting to the application...</p>
      <a href="./" style="display: inline-block; padding: 0.5rem 1rem; background-color: #4f46e5; color: white; border-radius: 0.375rem; text-decoration: none; font-weight: 500;">Go to Home</a>
    </div>
  </body>
</html>
